services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
    container_name: dcm-db
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
    ports:
      - "8081:8081"
    networks:
      - app-network
    container_name: dcm-api
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      PORT: ${PORT}
      API_URL: http://api:8080
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS}
    ports:
      - "${PORT}:3000"
    networks:
      - app-network
    container_name: dcm-web
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_PORT: ${PGADMIN_PORT:-5050}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - db
    networks:
      - app-network
    container_name: dcm-pgadmin
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
