spring.application.name=monitor

# Habilita o suporte do Spring Boot ao Docker Compose.
# O Spring localiza automaticamente o compose.yaml na raiz do projeto
# e configura o DataSource (URL, usuário e senha) a partir do container PostgreSQL.
spring.docker.compose.file=../compose.yaml

# Valida o esquema das entidades JPA contra o esquema do banco de dados.
# 'validate' não cria nem altera tabelas — apenas verifica se batem.
# Isso evita que o Hibernate sobrescreva as migrations do Flyway.
spring.jpa.hibernate.ddl-auto=validate

# Exibe no console os SQLs gerados pelo Hibernate (útil para debug didático)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Localização dos scripts de migration do Flyway
spring.flyway.locations=classpath:db/migration
