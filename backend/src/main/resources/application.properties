spring.application.name=monitor

spring.datasource.url=jdbc:postgresql://localhost:5432/device_checker
spring.datasource.username=postgres
spring.datasource.password=postgres

# Valida o esquema das entidades JPA contra o esquema do banco de dados.
# 'validate' nao cria nem altera tabelas -- apenas verifica se batem.
# Isso evita que o Hibernate sobrescreva as migrations do Flyway
spring.jpa.hibernate.ddl-auto=validate

# Exibe no console os SQLs gerados pelo Hibernate (utile para debug didatico)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Localizacao dos scripts de migration do Flyway
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:dev-only-change-this-secret-before-production-device-checker-monitor}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Configuracao de log no console (Docker captura stdout/stderr)
# Padrão: console é o destino em containers Spring Boot
logging.level.root=INFO
logging.level.br.checker.monitor=DEBUG
logging.level.org.springframework=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
