spring.application.name=monitor

spring.datasource.url=jdbc:postgresql://localhost:5432/device_checker
spring.datasource.username=postgres
spring.datasource.password=postgres

# Valida o esquema das entidades JPA contra o esquema do banco de dados.
# 'validate' não cria nem altera tabelas — apenas verifica se batem.
# Isso evita que o Hibernate sobrescreva as migrations do Flyway.
spring.jpa.hibernate.ddl-auto=validate

# Exibe no console os SQLs gerados pelo Hibernate (útil para debug didático)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Localização dos scripts de migration do Flyway
spring.flyway.locations=classpath:db/migration
