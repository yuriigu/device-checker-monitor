<div [class]="showSidebar() ? 'flex h-screen bg-gray-100 overflow-hidden' : 'min-h-screen bg-slate-950'">

  @if (showSidebar()) {
    <app-sidebar class="w-84 h-full flex flex-col shrink-0"></app-sidebar>
  }

  <main [class]="showSidebar() ? 'flex-1 flex flex-col overflow-y-auto' : 'min-h-screen w-full'">
    <div [class]="showSidebar() ? 'p-8 flex-1' : 'min-h-screen'">
      <router-outlet></router-outlet>
    </div>
  </main>

</div>
