<form [formGroup]="deviceForm" (ngSubmit)="onSubmit()">
  <label>
    <span class="text-gray-700 font-medium">Nome do Dispositivo *</span>
    <input formControlName="name"
           type="text"
           placeholder="Ex: Roteador-Core-01"
           [ngClass]="{
             'border-red-500 bg-red-50': isFieldInvalid('name'),
             'border-gray-300': !isFieldInvalid('name')
           }"
           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">

    @if (isFieldInvalid('name')){
      <span class="text-xs text-red-600 mt-1 block">
        O campo Nome é obrigatório.
      </span>
    }
  </label>

  <label>
    <span class="text-gray-700 font-medium">ID da Marca (idBrand) *</span>
    <input formControlName="idBrand"
           type="number"
           placeholder="Ex: 1"
           [ngClass]="{
             'border-red-500 bg-red-50': isFieldInvalid('idBrand'),
             'border-gray-300': !isFieldInvalid('idBrand')
           }"
           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">

    @if (isFieldInvalid('idBrand')){
      <span class="text-xs text-red-600 mt-1 block">
        O campo ID da Marca é obrigatório.
      </span>
    }
  </label>

  <label>
    <span class="text-gray-700 font-medium">ID do Modelo (idModel)</span>
    <input formControlName="idModel"
           type="number"
           placeholder="Ex: 1"
           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
  </label>

  <label>
    <span class="text-gray-700 font-medium">IP *</span>
    <input formControlName="ipAddress"
           type="text"
           placeholder="Ex: 192.168.0.1"
           [ngClass]="{
             'border-red-500 bg-red-50': isFieldInvalid('ipAddress'),
             'border-gray-300': !isFieldInvalid('ipAddress')
           }"
           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">

    @if (isFieldInvalid('ipAddress')){
      <span class="text-xs text-red-600 mt-1 block">
        O campo IP é obrigatório.
      </span>
    }
  </label>

  <label>
    <span class="text-gray-700 font-medium">MAC </span>
    <input formControlName="macAddress"
           type="text"
           placeholder="Ex: 00:1A:2B:3C:4D:5E"
           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
  </label>

  <label>
    <span class="text-gray-700 font-medium">ID da Permissão (idRole) *</span>
    <input formControlName="idRole"
           type="number"
           placeholder="Ex: 1"
           [ngClass]="{
             'border-red-500 bg-red-50': isFieldInvalid('idRole'),
             'border-gray-300': !isFieldInvalid('idRole')
           }"
           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">

    @if (isFieldInvalid('idRole')){
      <span class="text-xs text-red-600 mt-1 block">
        O campo Permissão é obrigatório.
      </span>

    }
  </label>

  <label>
    <span class="text-gray-700 font-medium">ID do Local (idPlace) *</span>
    <input formControlName="idPlace"
           type="number"
           placeholder="Ex: 1"
           [ngClass]="{
             'border-red-500 bg-red-50': isFieldInvalid('idPlace'),
             'border-gray-300': !isFieldInvalid('idPlace')
           }"
           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">

    @if (isFieldInvalid('idPlace')){
      <span class="text-xs text-red-600 mt-1 block">
        O campo ID do Local é obrigatório.
      </span>
    }
  </label>

  <button type="submit"
          class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md shadow focus:outline-none focus:ring-2 focus:ring-blue-500">
    Cadastrar Dispositivo
  </button>
</form>
